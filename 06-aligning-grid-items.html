<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>Aligning Grid Items</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .lesson {
        background: #f4f6fa;
        border-right: 5px solid royalblue;
        padding: 15px;
        margin-bottom: 20px;
      }
      .lesson h2 {
        margin: 0 0 10px;
        direction: ltr;
        text-align: right;
        color: royalblue;
      }

      .container {
        width: 600px;
        background-color: #efefef;
        margin: 20px auto;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(4, 100px);
        grid-gap: 1rem;

        /* שליטה על כל הפריטים בתוך התאים שלהם */
        justify-items: center; /* יישור אופקי: start, center, end, stretch */
        align-items: center; /* יישור אנכי: start, center, end, stretch */
      }
      .item {
        font-size: 1.5rem;
        background-color: royalblue;
        color: #fff;
        padding: 10px 20px;
      }
    </style>
  </head>
  <body>
    <div class="lesson">
      <h2>6. Aligning Grid Items (יישור בתוך התא)</h2>
      <p>
        <code>justify-items</code> מיישר את הפריטים לאורך ציר הרוחב של התא,
        ו-<code>align-items</code> מיישר אותם לאורך הגובה בתוך התא[cite: 15, 23,
        24].
      </p>
    </div>

    <div class="container">
      <div class="item">item 1</div>
      <div class="item">item 2</div>
      <div class="item">item 3</div>
      <div class="item">item 4</div>
      <div class="item">item 5</div>
      <div class="item">item 6</div>
      <div class="item">item 7</div>
      <div class="item">item 8</div>
    </div>

    <div><a href="index.html">← חזרה לתפריט</a></div>
  </body>
</html>

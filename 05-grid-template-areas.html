<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>אלמנטים עם שמות (Grid Areas)</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .lesson {
        background: #f4f6fa;
        border-right: 5px solid royalblue;
        padding: 15px;
        margin-bottom: 20px;
      }
      .lesson h2 {
        margin: 0 0 10px;
        direction: ltr;
        text-align: right;
        color: royalblue;
      }

      .container {
        width: 800px;
        height: 500px;
        background-color: #efefef;
        margin: 30px auto;
        display: grid;
        grid-template-rows: 1fr 1fr 1fr 1fr;
        grid-template-columns: 1fr 1fr 1fr;
        grid-gap: 1rem;
      }

      .container div {
        background-color: royalblue;
        font-size: 1.5rem;
        text-align: center;
        padding: 1rem;
        color: #fff;
      }

      .header {
        grid-column: 1 / -1;
        grid-row: 1 / 2;
      }
      .sidebar {
        grid-column: 1 / 2;
        grid-row: 2 / 5;
      }
      .main {
        grid-column: 2 / -1;
        grid-row: 2 / 4;
      }
      .box-1 {
        grid-column: 2 / 3;
        grid-row: 4 / 5;
      }
      .box-2 {
        grid-column: 3 / 4;
        grid-row: 4 / 5;
      }
      .box-3 {
        grid-column: 4 / -1;
        grid-row: 4 / 5;
      }
      .footer {
        grid-column: 1 / -1;
        grid-row: 5 / -1;
      }
    </style>
  </head>
  <body>
    <div class="lesson">
      <h2>5. אלמנטים עם שמות ומבנה Layout</h2>
      <p>
        סידור שלד עמוד מלא בעזרת הגדרות מיקום של רכיבים בעלי משמעות: כותרת
        עליונה, סרגל צד, תוכן מרכזי ופוטר[cite: 15, 22].
      </p>
    </div>

    <div class="container">
      <div class="header">Header</div>
      <div class="sidebar">Sidebar</div>
      <div class="main">Main</div>
      <div class="box-1">Box 1</div>
      <div class="box-2">Box 2</div>
      <div class="box-3">Box 3</div>
      <div class="footer">Footer</div>
    </div>

    <div><a href="index.html">← חזרה לתפריט</a></div>
  </body>
</html>
